<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary meta. The seo placeholders are filled at build and dev time
         by vite-plugin-seo.js from src/content/seo.js (VITE_APP_103_LIVE). -->
    <title>{{seo.title}}</title>
    <meta name="title" content="{{seo.title}}" />
    <meta name="description" content="{{seo.description}}" />
    <meta name="keywords" content="meditation timer, meditation app, binaural beats, mindfulness timer, focus timer, sleep sounds, brown noise, prayer timer, interval bells, Apple Watch meditation, mindful minutes, iOS meditation app, free meditation app" />
    <meta name="author" content="OPUS" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />
    <link rel="canonical" href="{{seo.canonical}}" />

    <!-- Open Graph -->
    <meta property="og:type" content="{{seo.ogType}}" />
    <meta property="og:url" content="{{seo.ogUrl}}" />
    <meta property="og:title" content="{{seo.ogTitle}}" />
    <meta property="og:description" content="{{seo.ogDescription}}" />
    <meta property="og:image" content="{{seo.ogImage}}" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="{{seo.ogImageWidth}}" />
    <meta property="og:image:height" content="{{seo.ogImageHeight}}" />
    <meta property="og:image:alt" content="{{seo.ogImageAlt}}" />
    <meta property="og:site_name" content="{{seo.ogSiteName}}" />
    <meta property="og:locale" content="{{seo.ogLocale}}" />

    <!-- Twitter -->
    <meta name="twitter:card" content="{{seo.twitterCard}}" />
    <meta name="twitter:url" content="{{seo.twitterUrl}}" />
    <meta name="twitter:title" content="{{seo.twitterTitle}}" />
    <meta name="twitter:description" content="{{seo.twitterDescription}}" />
    <meta name="twitter:image" content="{{seo.twitterImage}}" />
    <meta name="twitter:image:alt" content="{{seo.twitterImageAlt}}" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <!-- Rounded digits where ui-rounded does not exist (outside Apple systems): only the ten digits and the colon. -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300&text=0123456789%3A&display=swap" rel="stylesheet" />

    <!-- Theme -->
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-itunes-app" content="app-id=6756740657, app-clip-bundle-id=ro.opus.loop.Clip, app-clip-display=card" />

    <!-- PWA (the service worker is registered from src/main.jsx, production only) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Loop" />

    <!-- Structured data -->
    <script type="application/ld+json">
{{seo.jsonLd}}
    </script>

    <!-- SPA GitHub Pages redirect handler -->
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
